<svg xmlns="http://www.w3.org/2000/svg" width="960" height="380" viewBox="0 0 960 380" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0F172A"/>
      <stop offset="1" stop-color="#1E1B4B"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8B5CF6"/>
      <stop offset="1" stop-color="#06B6D4"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#94A3B8"/>
    </marker>
  </defs>
  <rect width="960" height="380" rx="18" fill="url(#bg)"/>

  <!-- Speaker side -->
  <g>
    <rect x="36" y="64" width="250" height="132" rx="14" fill="#1E293B" stroke="#334155"/>
    <text x="161" y="94" fill="#94A3B8" font-size="13" text-anchor="middle">YOU SPEAK HEBREW</text>
    <text x="161" y="132" fill="#F8FAFC" font-size="19" text-anchor="middle" direction="rtl">עשיתי ריפקטור לכל הבקאנד</text>
    <text x="161" y="168" fill="#64748B" font-size="12" text-anchor="middle">real microphone</text>
  </g>

  <!-- Engine -->
  <g>
    <rect x="355" y="44" width="250" height="172" rx="16" fill="#111827" stroke="url(#accent)" stroke-width="2"/>
    <text x="480" y="80" fill="#F8FAFC" font-size="20" font-weight="700" text-anchor="middle">Live Translator</text>
    <text x="480" y="110" fill="#A78BFA" font-size="13" text-anchor="middle">Whisper large-v3 · Groq</text>
    <text x="480" y="132" fill="#67E8F9" font-size="13" text-anchor="middle">Claude Haiku · streaming</text>
    <text x="480" y="154" fill="#FDE68A" font-size="13" text-anchor="middle">Neural voice · Piper / Kokoro</text>
    <rect x="410" y="172" width="140" height="28" rx="14" fill="url(#accent)"/>
    <text x="480" y="191" fill="#0F172A" font-size="13" font-weight="700" text-anchor="middle">≈ 1.2–2.0 s</text>
  </g>

  <!-- Listener side -->
  <g>
    <rect x="674" y="64" width="250" height="132" rx="14" fill="#1E293B" stroke="#334155"/>
    <text x="799" y="94" fill="#94A3B8" font-size="13" text-anchor="middle">THEY HEAR ENGLISH</text>
    <text x="799" y="130" fill="#F8FAFC" font-size="16" text-anchor="middle">“I did a refactor of the</text>
    <text x="799" y="150" fill="#F8FAFC" font-size="16" text-anchor="middle">entire backend.”</text>
    <text x="799" y="176" fill="#64748B" font-size="12" text-anchor="middle">Zoom · Meet · Teams · any app</text>
  </g>

  <line x1="290" y1="130" x2="350" y2="130" stroke="#94A3B8" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="610" y1="130" x2="670" y2="130" stroke="#94A3B8" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Subtitle window mock (reverse direction) -->
  <g>
    <rect x="160" y="244" width="640" height="112" rx="12" fill="#111418" stroke="#2A2F37"/>
    <circle cx="776" cy="262" r="4" fill="#3DDC84"/>
    <text x="766" y="266" fill="#8A94A3" font-size="11" text-anchor="start" direction="rtl">כתוביות: מתרגם</text>
    <text x="180" y="266" fill="#8A94A3" font-size="11">THEY SPEAK ENGLISH → YOU READ &amp; HEAR HEBREW</text>
    <text x="780" y="296" fill="#F5F7FA" font-size="19" font-weight="700" text-anchor="start" direction="rtl">איך היית שומרת על עקביות בין שירותים עם אאוטבוקס פאטרן?</text>
    <text x="180" y="318" fill="#8A94A3" font-size="12">How would you handle eventual consistency across services with an outbox pattern?</text>
    <text x="780" y="342" fill="#FFD166" font-size="13" text-anchor="start" direction="rtl">💡 אאוטבוקס פאטרן: ההודעה נשמרת באותה טבלה כמו השינוי ונשלחת משם בהמשך</text>
  </g>
</svg>
